# El plan gratuito usa un sistema de archivos efímero; antes de habilitar cargas administrativas en producción, se debe decidir entre un disco persistente en un plan pago o almacenamiento de objetos.
services:
  - type: web
    name: globalizat-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@globalizat.demo
      - key: CORS_ORIGIN
        value: https://pablodarkyy.github.io
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: UPLOADS_DIR
        sync: false
