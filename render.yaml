services:
  - type: web
    name: globalizat-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://pablodarkyy.github.io
      - key: SEED_ADMIN_EMAIL
        value: admin@globalizat.demo
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
